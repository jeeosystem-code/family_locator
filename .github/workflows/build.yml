name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q FamilyLocator.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Add Firebase config
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > FamilyLocator/app/google-services.json
      - name: Build
        working-directory: FamilyLocator
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FamilyLocator-apk
          path: FamilyLocator/app/build/outputs/apk/debug/app-debug.apk
